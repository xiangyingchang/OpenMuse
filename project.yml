name: OpenMuse
options:
  bundleIdPrefix: org.openmuse
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  OpenMuseCore:
    path: .
targets:
  OpenMuseiOS:
    type: application
    platform: iOS
    info:
      path: Config/OpenMuse-iOS-Info.plist
      properties:
        CFBundleDisplayName: OpenMuse
        CFBundleShortVersionString: 0.1.3
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAlarmKitUsageDescription: OpenMuse 会按你的聊天请求在 iPhone 上设置闹钟或计时器。
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - org.openmuse.ios.maintenance-review
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Apps/iOS
    dependencies:
      - package: OpenMuseCore
        product: OpenMuseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openmuse.ios
        PRODUCT_NAME: OpenMuse
        MARKETING_VERSION: 0.1.3
        CURRENT_PROJECT_VERSION: 11
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenMuse
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Apps/iOS/OpenMuse-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/ish-arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(inherited)
          - $(SRCROOT)/.build/OpenMuse-iSH/lib
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - $(inherited)
          - -lish
          - -lish_emu
          - -lfakefs
          - -lsqlite3
          - -lresolv
          - -lm
    preBuildScripts:
      - name: Build pinned iSH ARM64 runtime
        script: |
          set -euo pipefail
          if [[ "$PLATFORM_NAME" != "iphoneos" ]]; then exit 0; fi
          "$SRCROOT/Scripts/build-ish-ios.sh"
    postBuildScripts:
      - name: Bundle Alpine iSH rootfs and package notices
        script: |
          set -euo pipefail
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$resources"
          cp "$SRCROOT/LICENSE" "$resources/LICENSE"
          cp "$SRCROOT/THIRD_PARTY_NOTICES.md" "$resources/THIRD_PARTY_NOTICES.md"
          cp "$SRCROOT/Vendor/ish-arm64/LICENSE.md" "$resources/iSH-LICENSE.md"
          cp "$SRCROOT/Vendor/ish-arm64/LICENSE.IOS" "$resources/iSH-LICENSE.IOS"
          if [[ "$PLATFORM_NAME" != "iphoneos" ]]; then exit 0; fi
          rm -rf "$resources/alpine-rootfs"
          ditto "$SRCROOT/.build/OpenMuse-iSH/alpine-rootfs" "$resources/alpine-rootfs"
          if [[ -f "$SRCROOT/.build/OpenMuse-iSH/alpine-package-notices.txt" ]]; then
            cp "$SRCROOT/.build/OpenMuse-iSH/alpine-package-notices.txt" "$resources/alpine-package-notices.txt"
          fi
  OpenMuseMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
    dependencies:
      - package: OpenMuseCore
        product: OpenMuseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openmuse.mac
        PRODUCT_NAME: OpenMuse
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenMuse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Bundle open source licenses and notices
        script: |
          set -euo pipefail
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$resources"
          cp "$SRCROOT/LICENSE" "$resources/LICENSE"
          cp "$SRCROOT/THIRD_PARTY_NOTICES.md" "$resources/THIRD_PARTY_NOTICES.md"
          cp "$SRCROOT/Vendor/ish-arm64/LICENSE.md" "$resources/iSH-LICENSE.md"
          cp "$SRCROOT/Vendor/ish-arm64/LICENSE.IOS" "$resources/iSH-LICENSE.IOS"
  OpenMuseiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/OpenMuseiOSUITests
    dependencies:
      - target: OpenMuseiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openmuse.ios.uitests
        TEST_TARGET_NAME: OpenMuseiOS
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
schemes:
  OpenMuseiOS:
    build:
      targets:
        OpenMuseiOS: all
    test:
      config: Debug
      targets:
        - OpenMuseiOSUITests
    run:
      config: Debug
  OpenMuseMac:
    build:
      targets:
        OpenMuseMac: all
    run:
      config: Debug
